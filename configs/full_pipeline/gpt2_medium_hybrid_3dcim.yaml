# Automatic hybrid digital–analog GPT-2-Medium × AIHWKit × heterogeneous
# 3D-CIM pipeline. Structure mirrors gpt2_hybrid_3dcim.yaml; only the model,
# hardware capacity, and output roots differ so both models can coexist in one
# results tree.
#
# Generalization companion to the gpt2-small configuration: same phases, same
# noise contract, larger substrate.

experiment:
  seed: 42
  placement_seed: 42

model:
  name: gpt2-medium
  device: cpu  # set to cuda in Colab
  # Phase 0 hardware-aware checkpoint (save_pretrained directory). null loads
  # the pretrained Hugging Face weights (PTQ contrast configuration).
  checkpoint: data/results/phase0_hwa_training/gpt2_medium/checkpoint_final

# Phase 0: hardware-aware noise-injection fine-tuning (see PHASE_0.md).
hwa_training:
  enabled: true
  output_root: data/results/phase0_hwa_training/gpt2_medium
  dataset:
    name: Salesforce/wikitext
    config: wikitext-103-raw-v1
    split: train
    sequence_length: 512
    stride: 512
    batch_size: 4          # gpt2-medium is ~3x the activation footprint
    max_tokens: 33554432
    document_separator: "\n\n"
    drop_incomplete_final_sequence: true
  max_steps: 2000
  gradient_accumulation_steps: 8   # keeps ~16k tokens per optimizer step
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  precision: bf16
  seed: 42
  noise:
    noise_std_range: [0.0, 0.046]
    clip_in_forward: true
    include_lm_head: true
    exclude_projection_ids: []
  checkpoint_every_steps: 250
  keep_last_checkpoints: 2
  eval_every_steps: 250
  eval_max_tokens: 65536

# Phase 1 sensitivity calibration data.
dataset:
  name: Salesforce/wikitext
  config: wikitext-103-raw-v1
  split: validation
  sequence_length: 1024
  stride: 1024
  batch_size: 1
  max_tokens: null
  document_separator: "\n\n"
  drop_incomplete_final_sequence: true

# Smaller calibration subset used by measured digital-set search. This remains
# separate from the held-out test set used for final Phase 4 reporting.
digital_selection_dataset:
  name: Salesforce/wikitext
  config: wikitext-103-raw-v1
  split: validation
  sequence_length: 1024
  stride: 1024
  batch_size: 1
  max_tokens: 65536
  document_separator: "\n\n"
  drop_incomplete_final_sequence: true

# Held-out final evaluation data.
evaluation_dataset:
  name: Salesforce/wikitext
  config: wikitext-103-raw-v1
  split: test
  sequence_length: 1024
  stride: 1024
  batch_size: 1
  max_tokens: null
  document_separator: "\n\n"
  drop_incomplete_final_sequence: true

# 176×8 provides 1408 physical tiers. GPT-2 Medium (24 blocks, d=1024)
# requires 48 shards per block at 512×512 (12 fused-QKV c_attn + 4 attn.c_proj
# + 16 mlp.c_fc + 16 mlp.c_proj) = 1152 transformer shards, plus
# ceil(50257/512)×ceil(1024/512) = 198 LM-head shards: 1350 total, so all 97
# candidates can initially remain analog.
hardware:
  num_tiles: 176
  tiers_per_tile: 8
  tier_shape:
    rows: 512
    cols: 512
  num_thermal_zones: 8

analog:
  clip_sigma: 2.5
  range_mode: peak_to_peak
  reference_noise_std: 0.023
  tile_size: 512
  adc_dac_bits: 8
  # null inherits AIHWKit's IOParameters default (12.0 in aihwkit 1.1.0)
  output_bound: null
  weight_scaling_omega: 1.0
  weight_scaling_columnwise: false

phase1:
  output_root: data/results/phase1_sensitivity_medium
  results_filename_prefix: gpt2_medium_hybrid_sensitivity

profiling:
  include_lm_head: true
  num_seeds: 5
  seed_stride: 1
  # Empty list profiles every transformer block (all 24 for gpt2-medium).
  profile_blocks: []
  antithetic: true
  sensitivity_field: delta_nll_noise_mean
  sensitivity_unit: delta_nll_noise
  proxy:
    enabled: true
    max_batches: 32

# Phase 1.5: automatic measured digital-set selection.
digital_selection:
  output_root: data/results/phase1_5_digital_selection_medium

  forced_digital: []
  # Fixed budgets via top-k measured sensitivity; see the gpt2-small
  # configuration comment.
  methods: [sensitivity_rank]
  budgets:
    projection_counts: [2, 4, 8]
    parameter_fractions: []
    mac_fractions: []
  explicit_sets: {}

  greedy_marginal:
    enabled: true
    forced_digital: []
    candidate_pool_size: null
    max_promotions: 16
    objective: gain_per_cost
    cost_field: macs_per_token
    target_delta_nll_vs_digital: 0.10
    minimum_marginal_nll_gain: 0.0
    max_digital_mac_fraction: 0.50
    max_digital_parameter_fraction: 0.50

phase2:
  name: mixed_176x8
  output_root: data/results/phase2_fidelity_medium/fidelity_traces
  # Parameter provenance: see gpt2_hybrid_3dcim.yaml and
  # docs/PHASE_2.md#parameter-provenance.
  fidelity_model:
    num_timesteps: 120
    reference_noise_std: 0.023
    min_noise_std: 0.005
    max_noise_std: 0.080
    fidelity_classes:
      high:
        fraction: 0.25
        noise_multiplier_range: [0.65, 0.85]
      medium:
        fraction: 0.50
        noise_multiplier_range: [0.90, 1.15]
      low:
        fraction: 0.25
        noise_multiplier_range: [1.35, 1.70]
    degradation:
      gradual_drift:
        enabled: true
        total_increase_range: [0.12, 0.35]
      thermal_variation:
        enabled: true
        correlation: 0.94
        standard_deviation_fraction: 0.05
      localized_fault:
        enabled: true
        num_affected_tiles: 14   # same 1/12 tile fraction as the 96-tile substrate
        onset_timestep_range: [35, 90]
        noise_increase_range: [0.25, 0.70]
        candidate_classes: [high, medium, low]
        make_unavailable: false

phase3:
  sensitivity_floor: 0.0
  output_root: data/results/phase3_static_mapping_medium
  mapping_timestep: 0
  policies:
    - random
    - sequential
    - hardware_only
    - static_sensitivity
    - static_fisher

phase4:
  output_root: data/results/phase4_hybrid_quality_medium
  policies:
    - random
    - sequential
    - hardware_only
    - static_sensitivity
    - static_fisher
  method_policies: [static_sensitivity, static_fisher]
  baseline_policies: [random, sequential, hardware_only]
  lambada:
    enabled: true
    name: EleutherAI/lambada_openai
    config: en
    split: test
    max_examples: 1000
    batch_size: 8
    noisy_scope: realization0
  timesteps: [0, 30, 60, 90, 119]
  num_realizations: 3
  antithetic: false
  unavailable_noise_std: 0.080

  evaluate_budget_types: [greedy_step, projection_count]
  evaluate_selection_methods:
    - greedy_measured_gain_per_cost_per_macs_per_token
    - sensitivity_rank
  max_operating_points: 3

# First-order analytical per-token energy model; see the gpt2-small
# configuration and docs/REFERENCES.md for constant provenance.
cost_model:
  e_mac_digital_pj: 0.25
  e_analog_mac_pj: 0.005
  e_adc_pj: 1.5
  e_dac_pj: 0.1
